<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0e">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="SAFAR — premium shipping operations console">
  <link rel="manifest" href="/safar/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/safar/icon.svg">
  <link rel="stylesheet" href="/safar/style.css">
  <title>SAFAR — Shipping Operations OS</title>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div id="app" class="safar-shell">
    <div class="boot">
      <div class="boot-symbol">S<span class="boot-slash">/</span>F</div>
      <div class="boot-caption">SAFAR · SHIPPING OPERATIONS</div>
      <div class="loading-bar"><span></span></div>
    </div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/safar/app.js" defer></script>
</body>
</html>
