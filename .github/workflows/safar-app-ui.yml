name: SAFAR APP UI checks
on:
  pull_request:
    paths:
      - "safar_web/**"
      - "safar_app.py"
      - "tests/test_safar_app.py"
      - "tests/e2e/**"
      - "tests/ui/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.cjs"
      - "safar_auth.py"
      - "safar_operations.py"
      - "order_pipeline.py"
      - "order_journal.py"
      - "bot.py"
      - ".github/workflows/safar-app-ui.yml"
  push:
    branches: [main]
    paths:
      - "safar_web/**"
      - "safar_app.py"
      - "tests/test_safar_app.py"
      - "tests/e2e/**"
      - "tests/ui/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.cjs"
      - "safar_auth.py"
      - "safar_operations.py"
      - "order_pipeline.py"
      - "order_journal.py"
      - "bot.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked browser and local fixture dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Validate pure JavaScript syntax
        run: node --check safar_web/app.js
      - name: PWA cache/privacy and JavaScript regression checks
        run: npm run test:js
      - name: Synthetic local-only desktop and Android browser QA
        run: npm run test:e2e
      - name: Upload screenshot and browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safar-app-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
