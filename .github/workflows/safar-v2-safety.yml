name: SAFAR v2 safety tests

on:
  push:
    branches:
      - feat/safar-v2-access-and-operations-20261008
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Full mock-only regression suite
        env:
          SAFAR_DISABLE_BACKGROUND: "1"
        run: python -m unittest discover -s tests -v
